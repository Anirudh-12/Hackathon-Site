{% extends "_base_public.html" %}
{% block title %}Create account — Hackforge{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">Create account</h1>
    <p class="auth-sub">Already have one? <a href="/login">Sign in</a></p>

    {% if error %}
    <div class="flash flash-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/register" class="auth-form">
      <label class="form-label" for="name">Full name</label>
      <input id="name" name="name" type="text" class="input" required autofocus placeholder="Your name">

      <label class="form-label" for="email">Email</label>
      <input id="email" name="email" type="email" class="input" required placeholder="you@example.com">

      <label class="form-label" for="password">Password</label>
      <input id="password" name="password" type="password" class="input" required placeholder="••••••••" minlength="8">

      <button type="submit" class="btn btn-primary btn-full">Create account</button>
    </form>
  </div>
</div>
{% endblock %}
